
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Broken Heart</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#030303;color:white;
 overflow:hidden;font-family:Arial;
}
.scene{
 height:100vh;width:100%;
 position:relative;overflow:hidden;
 display:flex;align-items:center;justify-content:center;
 background:radial-gradient(ellipse,#230008,#080204 65%,#000);
}
.heart{
 position:absolute;
 width:min(92vw,470px);
 height:min(65vh,470px);
 top:50%;left:50%;
 transform:translate(-50%,-50%);
 filter:drop-shadow(0 0 18px #900019);
}
.half{
 position:absolute;inset:0;
 width:100%;height:100%;
 object-fit:contain;
}
.left{clip-path:inset(0 50% 0 0)}
.right{clip-path:inset(0 0 0 50%)}

.heart img{animation:beat .9s infinite}
@keyframes beat{
 0%,100%{scale:1}
 45%{scale:1.035}
}
.scene.hit .heart img{animation:none}

.left,.right{
 transition:transform 1.8s cubic-bezier(.2,.8,.2,1);
}
.scene.broken .left{
 transform:translate(-85px,12px) rotate(-9deg);
}
.scene.broken .right{
 transform:translate(85px,12px) rotate(9deg);
}

.arrow{
 position:absolute;
 left:-180px;
 top:50%;
 width:180px;height:38px;
 z-index:8;
 transform:translateY(-50%);
 opacity:0;
}
.arrow svg{width:100%;height:100%}
.scene.hit .arrow{
 opacity:1;
 animation:shoot 1.5s linear forwards;
}
@keyframes shoot{
 from{left:-180px}
 to{left:120vw}
}

.drop{
 position:absolute;
 top:48%;
 left:50%;
 width:12px;height:19px;
 background:linear-gradient(135deg,#ff4b58,#8b0014);
 border-radius:60% 40% 65% 65%;
 opacity:0;z-index:9;
 box-shadow:0 0 8px #f00;
}
.scene.hit .drop{animation:drip 1.2s infinite}
.drop:nth-child(2){margin-left:-25px}
.drop:nth-child(3){margin-left:25px;animation-delay:.3s}
.drop:nth-child(4){margin-left:50px;animation-delay:.6s}
.drop:nth-child(5){margin-left:-50px;animation-delay:.8s}
@keyframes drip{
 0%{opacity:0;transform:translateY(-5px)}
 20%{opacity:1}
 100%{opacity:0;transform:translateY(130px) scale(.5)}
}

.caption{
 position:absolute;bottom:12%;
 width:100%;text-align:center;
 opacity:0;transition:opacity 2s;
 padding:15px;
 z-index:10;
}
.scene.broken .caption{opacity:1}
.caption h2{
 font-weight:normal;font-size:23px;
 text-shadow:0 0 15px #d00032;
}
.caption p{font-size:13px;color:#aaa}

.replay{
 position:absolute;bottom:25px;
 background:#28000a;color:white;
 border:1px solid #a52b45;
 padding:12px 25px;border-radius:25px;
 opacity:0;z-index:20;
}
.scene.broken .replay{opacity:1}
</style>
</head>
<body>

<div class="scene" id="scene">

<div class="heart">
<img class="half left"
src="82E1EEAA-A925-40CA-8492-4111C5414E50.png">
<img class="half right"
src="82E1EEAA-A925-40CA-8492-4111C5414E50.png">
</div>

<div class="arrow">
<svg viewBox="0 0 180 38">
<path d="M0 13 L145 13 L145 1 L180 19 L145 37 L145 25 L0 25Z"
fill="#d6d6dc" stroke="#777" stroke-width="1.5"/>
<path d="M5 16 L145 16" stroke="white" stroke-width="2"/>
</svg>
</div>

<div class="drop"></div>
<div class="drop"></div>
<div class="drop"></div>
<div class="drop"></div>

<div class="caption">
<h2>مو كل قلب ينكسر يرجع مثل قبل...</h2>
<p>Some wounds never heal.</p>
</div>

<button class="replay" onclick="start()">إعادة المشهد ↻</button>

</div>

<script>
const scene=document.getElementById("scene");

function start(){
 scene.classList.remove("hit","broken");

 setTimeout(()=>{
   scene.classList.add("hit");
 },3000);

 setTimeout(()=>{
   scene.classList.add("broken");
 },4500);
}
start();
</script>
</body>
</html>
