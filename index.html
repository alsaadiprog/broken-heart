
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Broken Heart</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050303;color:white;
 min-height:100vh;overflow:hidden;
 display:flex;align-items:center;justify-content:center;
 font-family:Arial,sans-serif;
}
.scene{
 width:100%;height:100vh;position:relative;
 display:flex;align-items:center;justify-content:center;
 background:radial-gradient(ellipse,#260008,#080204 65%,#000);
 overflow:hidden;
}
.glow{
 position:absolute;width:320px;height:320px;
 background:#d0003030;filter:blur(75px);
}
.art{
 position:absolute;width:100%;max-width:650px;
 display:flex;justify-content:center;
 top:50%;transform:translateY(-50%);
 animation:heartbeat .85s infinite;
 filter:drop-shadow(0 0 20px #a90025);
}
.art img{
 width:100%;height:auto;display:block;
}
@keyframes heartbeat{
 0%,100%{scale:1}
 45%{scale:1.035}
}
.art.stop{animation:none}

.drop{
 position:absolute;top:65%;left:50%;
 width:11px;height:18px;border-radius:60% 40% 65% 65%;
 background:#c40022;box-shadow:0 0 10px red;
 opacity:0;z-index:5;
}
.scene.hit .drop{animation:drip 1.5s infinite}
.drop:nth-child(2){margin-left:-65px}
.drop:nth-child(3){margin-left:45px;animation-delay:.4s!important}
.drop:nth-child(4){margin-left:85px;animation-delay:.8s!important}
.drop:nth-child(5){margin-left:-100px;animation-delay:1s!important}

@keyframes drip{
 0%{opacity:0;transform:translateY(-10px)}
 20%{opacity:1}
 100%{opacity:0;transform:translateY(150px) scale(.5)}
}

.message{
 position:absolute;bottom:13%;width:100%;
 text-align:center;padding:0 15px;
 opacity:0;transition:opacity 2s;
 z-index:10;
}
.message h2{
 font-size:clamp(19px,5vw,27px);
 font-weight:normal;
 text-shadow:0 0 15px #e00035;
}
.message p{color:#aaa;font-size:13px}

.scene.hit .message{opacity:1}

button{
 position:absolute;bottom:35px;z-index:20;
 background:#30000c;border:1px solid #a72a45;
 color:white;padding:12px 25px;
 border-radius:30px;font-size:15px;
 opacity:0;cursor:pointer;
}
.scene.hit button{opacity:1}
</style>
</head>

<body>
<div class="scene" id="scene">

<div class="glow"></div>

<div class="art" id="art">
<img
 src="82E1EEAA-A925-40CA-8492-4111C5414E50.png"
 alt="Anatomical human heart pierced by an arrow">
</div>

<div class="drop"></div>
<div class="drop"></div>
<div class="drop"></div>
<div class="drop"></div>

<div class="message">
<h2>مو كل قلب ينكسر يرجع مثل قبل...</h2>
<p>Some wounds never heal.</p>
</div>

<button onclick="replay()">إعادة المشهد ↻</button>

</div>

<script>
const scene=document.getElementById("scene");
const art=document.getElementById("art");

function play(){
 scene.classList.remove("hit");
 art.classList.remove("stop");

 setTimeout(()=>{
   art.classList.add("stop");
   scene.classList.add("hit");
 },3500);
}

function replay(){play()}
play();
</script>
</body>
</html>
