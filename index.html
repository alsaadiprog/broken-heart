
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Broken Heart ❤️‍🩹</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080808;color:white;
 height:100vh;display:flex;align-items:center;
 justify-content:center;overflow:hidden;
 font-family:Arial,sans-serif;
}
.scene{text-align:center;position:relative;width:100%;height:450px}
.heart{
 position:absolute;width:230px;height:230px;
 left:50%;top:75px;transform:translateX(-50%);
 filter:drop-shadow(0 0 22px #f00035);
 animation:pulse .85s infinite;
}
.heart svg{width:100%;height:100%;overflow:visible}
.heart path{fill:#e60032}
.crack{
 fill:none!important;stroke:#fff;
 stroke-width:4;stroke-linecap:round;
 stroke-dasharray:180;stroke-dashoffset:180;
}
.arrow{
 position:absolute;left:-100px;top:135px;
 font-size:85px;transform:rotate(-10deg);
 opacity:0;z-index:5;
}
.text{
 position:absolute;top:345px;width:100%;
 font-size:23px;color:#eee;
 opacity:0;letter-spacing:1px;
 text-shadow:0 0 12px #e60032;
}
@keyframes pulse{
 0%,100%{scale:1}
 50%{scale:1.09}
}
.scene.hit .arrow{
 opacity:1;
 animation:shoot 1.5s ease-in forwards;
}
@keyframes shoot{
 to{left:calc(50% - 15px)}
}
.scene.hit .heart{
 animation:shatter 1s 1.3s forwards;
}
@keyframes shatter{
 0%{transform:translateX(-50%) scale(1)}
 40%{transform:translateX(-50%) scale(1.12) rotate(5deg)}
 100%{transform:translateX(-50%) scale(.85) rotate(-8deg);
 filter:grayscale(.6) drop-shadow(0 0 5px red)}
}
.scene.hit .crack{
 animation:crack .8s 1.5s forwards;
}
@keyframes crack{to{stroke-dashoffset:0}}
.scene.hit .text{
 animation:appear 2s 2.5s forwards;
}
@keyframes appear{to{opacity:1}}
</style>
</head>
<body>
<div class="scene" id="scene">

<div class="heart">
<svg viewBox="0 0 220 220">
<defs>
<linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#ff536b"/>
<stop offset="100%" stop-color="#800018"/>
</linearGradient>
</defs>
<path fill="url(#red)" d="M110 195
C90 178 22 130 22 77
C22 28 78 12 110 59
C145 12 200 29 198 77
C198 130 133 179 110 195Z"/>
<path d="M110 60 L103 95 L121 112 L94 139 L109 163 L100 181"
class="crack"/>
<path d="M88 48 Q70 20 91 10 M133 48 Q145 17 160 26"
fill="none" stroke="#a00025" stroke-width="13" stroke-linecap="round"/>
</svg>
</div>

<div class="arrow">➶</div>
<div class="text">مو كل قلب ينكسر يرجع مثل قبل...</div>

</div>
<script>
setTimeout(()=>{
document.getElementById("scene").classList.add("hit");
},3000);
</script>
</body>
</html>
